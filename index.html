<style>
  /* ---------- the entrance: preloader -> the port (choose) -> camera travels to the crate or to the side ---------- */
  html, body { height: 100%; }
  body { background: var(--paper); overflow: hidden; }
  .stage { position: fixed; inset: 0; background: var(--paper); }

  /* film: one master photo, and the camera-move clips that all start from it (so nothing jumps) */
  .film { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
  .film video, .film img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .film .live { opacity: 1; }
  .film #water { opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
    -webkit-mask: url(/assets/entrance/water-mask.png) center / cover no-repeat; mask: url(/assets/entrance/water-mask.png) center / cover no-repeat; }
  .film #water.on { opacity: 1; }
  .film #water.off { transition: opacity .4s ease-out; }
  /* the intro fades in from the preloader; every later swap (intro -> held frame -> branch) is an instant cut on identical frames */
  .film #intro.live { transition: opacity .4s; }
  .film::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s;
    background: linear-gradient(180deg, rgba(0,0,0,.32), transparent 20%, transparent 42%, rgba(0,0,0,.62)); }   /* no green tint on the photo (client, 2026-11-06): only a light neutral shade top and bottom so the header and doors read */
  .stage.ready .film::after { opacity: 1; }
  .stage.leaving .film::after { opacity: 0; transition: opacity .8s; }

  /* preloader: the 3D drawing of the mark (logo.html?preloader) draws on, spins out, and the loader fades onto the port */
  .loader { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: var(--paper); transition: opacity .3s cubic-bezier(.4,0,.2,1); }
  .loader .pl-logo { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .2s; }
  .loader.mark .pl-logo { opacity: 1; }
  .loader.out { opacity: 0; }
  .loader .pct { position: absolute; left: 52px; bottom: 56px; z-index: 1; font-family: var(--mono); font-size: 12px; letter-spacing: .18em; color: var(--muted); transition: opacity .3s; }
  .loader .pct b { font-weight: 400; color: var(--ink); }
  .loader.spin .pct { opacity: 0; }
  .loader.done { display: none; }

  /* the header, the headline and the two doors come in over the port */
  .site-header { opacity: 0; transform: translateY(-10px); transition: opacity 1s .3s, transform 1s .3s; }
  body:not(.ready) .site-header * { pointer-events: none !important; }
  body.ready .site-header { opacity: 1; transform: none; }
  .choice { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 90px 52px 40px; opacity: 0; transform: translateY(16px); transition: opacity .7s, transform .7s; pointer-events: none; }
  .stage.ready .choice { opacity: 1; transform: none; pointer-events: auto; }
  .choice .eyebrow { margin-bottom: 18px; }
  .choice h1 { max-width: 760px; text-wrap: balance; font-size: clamp(30px, 3.6vw, 48px); font-weight: 400; margin-bottom: 14px; text-shadow: 0 2px 30px rgba(0,0,0,.45); }
  .choice p { max-width: 600px; text-wrap: balance; color: var(--ink-soft); font-size: 17px; margin-bottom: 30px; text-shadow: 0 1px 20px rgba(0,0,0,.35); }
  /* the two doors, Terminal-style (user, 2026-11-06): no headline over the port, just two notched outline panels with a light
     running round each line; the outline and the frosted fill share one shape, drawn by shapeDoors() below */
  .choice { justify-content: flex-end; padding-bottom: clamp(48px, 12vh, 140px); }
  /* the words in the site's heading face, larger and in white with a deeper shade so they read on the photo; the words and
     the two doors now span the header bar's width, so they fill a wide screen (client, 2026-11-12) */
  .choice .intro { width: min(1280px, 100%); margin-bottom: clamp(22px, 3.4vh, 38px); text-align: left; }   /* a short header and one line over the doors (user, 2026-11-06) */
  .choice .intro h1 { max-width: none; margin: 0 0 10px; font-family: var(--display); font-size: clamp(26px, 2.7vw, 44px); font-weight: 700; text-transform: uppercase; letter-spacing: -.025em; line-height: .92;   /* the same size and weight as the names inside the two doors (client, 2026-11-12; was up to 88px) */ color: #FCFCFC; text-shadow: 0 2px 24px rgba(0,0,0,.7), 0 0 60px rgba(0,0,0,.45); }
  .choice .intro p { max-width: 60ch; margin: 0; font-size: clamp(15px, 1.25vw, 20px); font-weight: 600; line-height: 1.4; color: #FCFCFC; text-wrap: balance; text-shadow: 0 1px 14px rgba(0,0,0,.8), 0 0 36px rgba(0,0,0,.5); }
  .choice .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 2.4vw, 34px); width: min(1280px, 100%); }
  .door { position: relative; display: grid; gap: 12px; align-content: end; justify-items: start; min-height: clamp(190px, 27vh, 300px); padding: 40px clamp(28px, 3vw, 48px);
    background: none; border: 0; font-family: var(--sans); text-decoration: none; color: var(--ink); text-align: left; cursor: pointer; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .door:hover { transform: translateY(-3px); }
  .door-bg { position: absolute; inset: 0; z-index: -1; background: rgba(12,34,24,.6); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: background .35s; }
  .door:hover .door-bg { background: rgba(12,34,24,.74); }
  .door-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .door-line path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .door-line .edge { stroke: rgba(238,227,199,.42); stroke-width: 1.2; transition: stroke .35s; }
  .door:hover .door-line .edge { stroke: rgba(238,227,199,.75); }
  .door-line .run { stroke: #F4ECD6; stroke-width: 2; filter: drop-shadow(0 0 5px rgba(244,236,214,.95)) drop-shadow(0 0 14px rgba(244,236,214,.5)); }
  /* with Reduce Motion on, the light stays on the line (it does not travel): it used to disappear altogether */
  .door .k { font-family: var(--sans); font-size: 14px; letter-spacing: -.01em; text-transform: none; color: var(--muted); }
  .door .t { font-family: var(--display); font-size: clamp(26px, 2.7vw, 44px); font-weight: 700; text-transform: uppercase; letter-spacing: -.025em; line-height: .92; color: #FCFCFC; }
  .door .d { max-width: 42ch; font-size: clamp(14px, 1.1vw, 17px); font-weight: 500; line-height: 1.45; color: #F4EFE0; }
  .stage.leaving .choice { opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s; pointer-events: none; }

  /* captions during the zoom (Terminal-style): one big centred line at a time, letters light up from grey to cream */
  .captions { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; padding: 0 6vw; }
  .captions::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .6s;
    background: radial-gradient(ellipse 62% 42% at 50% 52%, rgba(0,0,0,.5), rgba(0,0,0,.22) 55%, transparent 80%); }
  .captions.on::before { opacity: 1; }
  .cap { grid-area: 1 / 1; max-width: 18ch; margin: 0; text-align: center; font-family: var(--display); font-weight: 700; text-transform: uppercase; color: var(--ink);
    font-size: clamp(30px, 3.4vw, 52px); line-height: .95; letter-spacing: -.03em; text-wrap: balance;   /* the site's heading size and weight (user, 2026-11-06) */
    text-shadow: 0 2px 22px rgba(0,0,0,.5); transition: opacity .55s, transform .7s cubic-bezier(.2,.7,.2,1), filter .55s; }
  .cap.out { opacity: 0; transform: translateY(-18px); filter: blur(6px); }
  .cap .ch { opacity: .22; transition: opacity .35s; }
  .cap .ch.lit { opacity: 1; }
  @media (max-width: 860px) { .cap { font-size: clamp(26px, 7vw, 34px); max-width: 14ch; } }

  /* the end of each journey: the frame goes to the paper green, the next page loads under it */
  .veil { position: absolute; inset: 0; z-index: 4; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  .stage.dark .veil { opacity: 1; }

  @media (max-width: 860px) {
    .choice { padding: 80px 20px 28px; }
    .doors { grid-template-columns: 1fr; gap: 14px; }
    .door { min-height: 118px; padding: 24px 22px; gap: 8px; }
    /* phones: each door's name on ONE line and its line smaller (client, 2026-11-12: the names were too big and wrapped) */
    .door .t { font-size: clamp(15px, 5.6vw, 24px); white-space: nowrap; }
    .choice .intro h1 { font-size: clamp(22px, 7.4vw, 34px); }   /* phones: one step above the door names, so it still reads as the heading */
    .door .d { font-size: clamp(12.5px, 3.5vw, 14.5px); line-height: 1.4; }
    .choice p { font-size: 15px; margin-bottom: 20px; }
    .loader .pct { left: 20px; bottom: 28px; }
    .film::after { background: linear-gradient(180deg, rgba(0,0,0,.32), transparent 18%, transparent 40%, rgba(0,0,0,.5)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage.ready .film #still { animation: none; }
  }
</style>

<body>
<div class="stage" id="stage">
  <div class="film" id="film">
    <!-- the branch clips load only once the doors are up (settle() calls load()), so they do not hold up the preloader. 1. intro: glides in to the bow; 2. its exact last frame is held behind the doors; 3. the chosen branch starts on that frame -->
    <img id="still" src="/assets/entrance/intro-v10-poster.jpg" srcset="/assets/entrance/intro-v10-poster.jpg 1920w, /assets/entrance/intro-v10-poster-hd.jpg 2560w" sizes="100vw" alt="" class="live" />
    <video id="intro" muted playsinline preload="auto" poster="/assets/entrance/intro-v10-poster.jpg"></video>
    <img id="hold" src="/assets/entrance/choice-v5.jpg" srcset="/assets/entrance/choice-v5.jpg 1920w, /assets/entrance/choice-v5-hd.jpg 2560w" sizes="100vw" alt="" />
    <video id="vc" muted playsinline preload="none"></video>
    <video id="ve" muted playsinline preload="none"></video>
    <!-- gentle water on the held frame: only the sea shows through its mask (ship, ropes, cranes stay the photo); fades out as a door's clip starts -->

      </button>
      <button class="door" id="goEngineering" type="button">
        <span class="door-bg" aria-hidden="true"></span><svg class="door-line" aria-hidden="true"><path class="edge"/><path class="run"/></svg>
        <span class="t">Engineering Solutions</span><span class="d">End-to-end project delivery for marine and energy infrastructure.</span>
      </button>

  </div>

  <div class="captions" id="captions" aria-live="polite"></div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const still = document.getElementById('still'), intro = document.getElementById('intro'), hold = document.getElementById('hold');
  const vc = document.getElementById('vc'), ve = document.getElementById('ve');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // smaller files on phones and narrow screens
  const small = Math.min(screen.width, screen.height) < 820 || (navigator.connection && /2g|3g/.test(navigator.connection.effectiveType || ''));
  // sharper 2560 px files for big and retina screens (a 1920 file is upscaled there and looks soft)
  const hd = !small && screen.width * (devicePixelRatio || 1) >= 2400;
  const VER = { commodities: 'v8b', intro: 'v10' };   // back on v8b (client, 2026-11-12: v8c was too fast; its files are in masters/entrance-v8c). v8c (2026-11-11): started moving at once, wireframe spread in 0.5 s (tools/port3d/speed_curve.py). v8b: faster opening push. Intro versions for the client to pick (2026-11-07): 1 = v8 original, 2 = v9 doors copied from the end frame, 3 = v10 steadied from its own neighbouring frames (posters: intro-vN-poster in the img/video tags above)
  const src = (n) => '/assets/entrance/' + n + '-' + (VER[n] || 'v8') + (small ? '-m' : hd ? '-hd' : '') + '.mp4';   // v8 (2026-11-07): native 4K; the held frame is cut from the intro footage itself, so nothing switches where the videos meet it
  intro.src = src('intro'); vc.src = src('commodities'); ve.src = src('engineering');
  const layers = [still, intro, hold, vc, ve];
  let want = still;   // the layer that should be on screen; late callbacks for an older layer are ignored
  const show = (el) => { if (el !== want) return; for (const v of layers) v.classList.toggle('live', v === el); };
  const canPlay = (v) => new Promise(res => { if (v.readyState >= 3) return res(true); const ok = () => res(true); v.addEventListener('canplaythrough', ok, { once: true }); v.addEventListener('error', () => res(false), { once: true }); setTimeout(() => res(v.readyState >= 2), 9000); });
  // cut to a video only once its first frame is really on screen (no black flash)
  const playVisible = (v) => new Promise((res, rej) => {
    want = v; v.currentTime = 0;
    const p = v.play(); if (p && p.catch) p.catch(rej);
    const reveal = () => { show(v); res(); };
    if ('requestVideoFrameCallback' in v) v.requestVideoFrameCallback(reveal); else v.addEventListener('playing', reveal, { once: true });
  });

  // ---- preloader: the 3D mark draws itself on -> (intro buffered) -> it spins out while the loader fades onto the port ----
  const loader = document.getElementById('loader');
  const plLogo = loader.querySelector('.pl-logo');
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const introReady = canPlay(intro);
  // the drawing tells us when it has finished; if it never loads (offline CDN), carry on after a few seconds
  const drawn = new Promise(r => { addEventListener('message', e => { if (e.data === 'logo-drawn') r(); }); setTimeout(r, 2600); });
  (async function preload() {
    if (reduce) { await introReady; loader.classList.add('done'); return settle(); }
    await frame(); loader.classList.add('mark');
    await drawn;   // the drawing finishes, then it opens straight away
    const ok = await Promise.race([introReady, wait(1500).then(() => intro.readyState >= 2)]);   // give the 4 s intro up to 1.5 s to be ready, so a first visit still sees the fly-in (2026-11-07)
    loader.classList.add('spin');
    plLogo.contentWindow && plLogo.contentWindow.postMessage({ type: 'logo-spinout' }, '*');
    await wait(60);                                     // the turn gets going, then the port shows through (2x faster, user 2026-11-06)
    if (ok) {
      // the zoom plays at 1.25x (2 s clip -> 1.6 s) and the doors start fading in 0.3 s before it lands: logo to doors in ~2 s (client, 2026-11-08; was ~3 s)
      intro.defaultPlaybackRate = intro.playbackRate = 1.25;
      intro.addEventListener('ended', settle, { once: true }); playVisible(intro).then(() => intro.playbackRate = 1.25).catch(settle);
      const early = setInterval(() => { if (settled) return clearInterval(early); if (intro.duration && intro.currentTime >= intro.duration - 0.375) { clearInterval(early); stage.classList.add('ready'); document.body.classList.add('ready'); } }, 30);
      setTimeout(() => { if (intro.paused || intro.currentTime < 0.05) settle(); }, 2500);   // never stuck on the poster if playback stalls
      setTimeout(settle, 6000);
    } else settle();
    loader.classList.add('out');
    await wait(320); loader.classList.add('done');
  })();
  // ---- the intro ends on the bow: hold that exact frame, bring in the header and the two doors, buffer both branches ----
  let settled = false;
  function settle() {
    if (settled) return; settled = true;
    want = hold; show(hold);
    stage.classList.add('ready'); document.body.classList.add('ready');
    vc.preload = ve.preload = 'auto'; vc.load(); ve.load();
    if (!reduce) startWater();
  }
  // ---- the sea moves gently on the held frame (2026-11-08): a masked loop over the still, everything else stays the photo ----
  const water = document.getElementById('water');
  function startWater() {
    water.src = '/assets/entrance/water-v1' + (small ? '-m' : hd ? '-hd' : '') + '.mp4';
    water.preload = 'auto'; water.load();
    canPlay(water).then(ok => {
      if (!ok || leaving) return;
      const p = water.play(); if (p && p.catch) p.catch(() => {});
      const on = () => { if (!leaving) water.classList.add('on'); };   // fades in, so the first ripple never pops
      if ('requestVideoFrameCallback' in water) water.requestVideoFrameCallback(on); else water.addEventListener('playing', on, { once: true });
    });
  }
  // a door was pressed: the clip underneath now starts on the same frame, so only the sea blends across (0.4 s)
  function stopWater() {
    if (!water.classList.contains('on')) { water.pause(); return; }
    water.classList.add('off'); water.classList.remove('on');
    setTimeout(() => water.pause(), 450);
  }

  // ---- captions over the zoom: [start, end] as fractions of the clip; letters light up across the first 55% of each line ----
  const LINES = {
    vc: [[0.04, 0.33, 'From the quay…'], [0.36, 0.64, 'into five industrial value chains.'], [0.67, 0.97, 'Innovating supply, empowering growth.']],
    ve: [[0.04, 0.33, 'From the berth…'], [0.36, 0.64, 'to every coupling and hose.'], [0.67, 0.97, 'Engineered for excellence, supported for life.']],
  };
  function runCaptions(v, lines) {
    const box = document.getElementById('captions'); box.innerHTML = '';
    const els = lines.map(([a, b, text]) => {
      const p = document.createElement('p'); p.className = 'cap out';
      p.innerHTML = text.split(' ').map(w => '<span style="white-space:nowrap">' + [...w].map(c => '<span class="ch">' + c + '</span>').join('') + '</span>').join(' ');
      box.appendChild(p); return { p, a, b, chs: [...p.querySelectorAll('.ch')] };
    });
    box.classList.add('on');
    const tick = () => {
      if (!v.duration) return requestAnimationFrame(tick);
      const f = v.currentTime / v.duration;
      for (const L of els) {
        const on = f >= L.a && f < L.b; L.p.classList.toggle('out', !on);
        const k = Math.max(0, Math.min(1, (f - L.a) / ((L.b - L.a) * 0.55)));
        const n = Math.round(k * L.chs.length);
        L.chs.forEach((c, i) => c.classList.toggle('lit', i < n));
      }
      if (f >= 0.97 || v.ended) { box.classList.remove('on'); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---- a branch: starts on the held frame, zooms in and turns into the wireframe; then the frame goes green and the page changes ----
  let leaving = false;
  async function journey(v, href, arrive) {
    if (leaving) return; leaving = true;
    stage.classList.add('leaving');
    let gone = false;
    const go = () => { if (gone) return; gone = true; want = null; stage.classList.add('dark');
      try { sessionStorage.setItem('hx-enter', '1'); } catch (e) {}   // the next page opens on this same green and fades in (client, 2026-11-08)
      setTimeout(() => { if (arrive) arrive(); else location.href = href; }, arrive ? 700 : 900); };
    if (reduce) return go();
    if (!(await canPlay(v))) { stopWater(); return go(); }
    try { await playVisible(v); } catch (e) { stopWater(); return go(); }
    stopWater();
    runCaptions(v, LINES[v.id]);
    const lead = 0.9;   // start the green veil just before the end so the last wireframe frames melt into the page colour
    const t = setInterval(() => { if (v.duration && v.currentTime >= v.duration - lead) { clearInterval(t); go(); } }, 50);
    v.addEventListener('ended', () => { clearInterval(t); go(); }, { once: true });
  }
  document.getElementById('goCommodities').addEventListener('click', () => journey(vc, '/commodities/'));
  document.getElementById('goEngineering').addEventListener('click', () => journey(ve, '/engineering/'));
})();
</script>
<script>
// the doors' outline: rounded corners and a notch, top centre on the first door and bottom centre on the second (as on
// terminal-industries.com); the frosted fill is cut to the same shape, and a short light runs round the line
(() => {
  const doors = [...document.querySelectorAll('.door')]; if (!doors.length) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function shape(w, h, notchTop) {
    const r = Math.min(18, h / 5), nw = Math.min(w * 0.42, 230), nd = Math.min(24, h * 0.12), s = 26, cx = w / 2;
    const a = cx - nw / 2 - s, b = cx - nw / 2, c = cx + nw / 2, d = cx + nw / 2 + s;
    const top = notchTop ? `L${a},0 C${a + s * .55},0 ${b - s * .45},${nd} ${b},${nd} L${c},${nd} C${c + s * .45},${nd} ${d - s * .55},0 ${d},0 ` : '';
    const bot = notchTop ? '' : `L${d},${h} C${d - s * .55},${h} ${c + s * .45},${h - nd} ${c},${h - nd} L${b},${h - nd} C${b - s * .45},${h - nd} ${a + s * .55},${h} ${a},${h} `;
    return `M${r},0 ${top}L${w - r},0 Q${w},0 ${w},${r} L${w},${h - r} Q${w},${h} ${w - r},${h} ${bot}L${r},${h} Q0,${h} 0,${h - r} L0,${r} Q0,0 ${r},0 Z`;
  }
  function draw() {
    doors.forEach((el, i) => {
      const w = el.offsetWidth, h = el.offsetHeight; if (!w || !h) return;
      const d = shape(w, h, i % 2 === 0), svg = el.querySelector('.door-line');
